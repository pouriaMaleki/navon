name: UX flow tests

# PR fast lane and slow lane separation — see plan:
#   /Users/Pouria.Abdolmaleki/.claude/plans/check-ios-app-and-dynamic-hummingbird.md
# Fast lane (every PR): rust-unit, web-unit, ios-unit, android-jvm. < 5 min target.
# Slow lane (main + nightly): parity (heavy), web-e2e, ios-ui, android-instrumented.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly slow-lane run — 03:15 UTC.
    - cron: "15 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ANDROID_HOME: /usr/local/android-sdk
  JAVA_HOME: /usr/local/jdk21

jobs:
  # ─── Fast lane ──────────────────────────────────────────────────────────
  rust-unit:
    name: Rust unit + fixture loader (fast)
    runs-on:
      - self-hosted
      - Linux
    steps:
      - uses: actions/checkout@v4
      - name: Generate map-data placeholder
        run: |
          mkdir -p data/map-data
          python3 - <<'PY'
          import struct
          out = (b'SVM1' + struct.pack('<i', 12) + struct.pack('<iiii', 0,0,0,0)
                 + struct.pack('<H', 0) + struct.pack('<I', 0))
          open('data/map-data/city.svm', 'wb').write(out)
          PY
      - name: Regenerate GPS fixtures
        run: cargo run -p xtask --bin gen-gps-fixtures
      - name: Verify committed GPS fixtures are up to date
        run: git diff --exit-code -- parity-fixtures/data
      - name: Run parity-fixtures tests (including flow tests)
        run: cargo test -p parity-fixtures

  web-unit:
    name: companion-apps/web vitest (fast)
    runs-on:
      - self-hosted
      - Linux
    defaults:
      run:
        working-directory: companion-apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate GPS fixtures
        working-directory: .
        run: |
          mkdir -p data/map-data && python3 -c "import struct; open('data/map-data/city.svm','wb').write(b'SVM1'+struct.pack('<i',12)+struct.pack('<iiii',0,0,0,0)+struct.pack('<H',0)+struct.pack('<I',0))"
          cargo run -p xtask --bin gen-gps-fixtures
      - name: Verify committed GPS fixtures are up to date
        working-directory: .
        run: git diff --exit-code -- parity-fixtures/data
      - run: npm ci
      - run: npm run lint || true
      - run: npm run test

  ios-unit:
    name: companion-apps/ios XCTest (fast)
    runs-on:
      - self-hosted
      - macOS
    if: github.repository_owner == github.repository_owner  # always, but leaves a seam
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Regenerate Xcode project
        working-directory: companion-apps/ios
        run: xcodegen generate
      - name: Build unsigned simulator app
        working-directory: companion-apps/ios
        run: |
          xcodebuild \
            -project Navon.xcodeproj \
            -scheme Navon \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run unit tests
        working-directory: companion-apps/ios
        run: |
          xcodebuild test \
            -project Navon.xcodeproj \
            -scheme Navon \
            -only-testing:NavonTests \
            -destination 'platform=iOS Simulator,name=iPad (A16),OS=26.5' \
            CODE_SIGNING_ALLOWED=NO

  android-jvm:
    name: companion-apps/android JVM tests (fast)
    runs-on:
      - self-hosted
      - Linux
    defaults:
      run:
        working-directory: companion-apps/android
    steps:
      - uses: actions/checkout@v4
      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --no-build-cache --rerun-tasks --tests "app.navon.bike.integration.cues.*"

  # ─── Slow lane (main + nightly) ─────────────────────────────────────────
  web-e2e:
    name: companion-apps/web Playwright (slow)
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
    defaults:
      run:
        working-directory: companion-apps/web
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:e2e

  android-instrumented:
    name: companion-apps/android Espresso (slow — NOT WIRED)
    # Explicitly disabled until the emulator runner is wired up (plan flow #46,
    # #32, #33, #34). Do not flip `if:` to true before adding
    # reactivecircus/android-emulator-runner@v2 to the steps below, otherwise
    # the placeholder step fails hard instead of passing silently.
    if: false
    runs-on: ubuntu-latest
    # Fail hard on purpose if this job is ever enabled without real coverage.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Not wired — fails on purpose if run
        run: |
          echo "android-instrumented is NOT WIRED. Add reactivecircus/android-emulator-runner@v2 here before flipping \`if:\` to true."
          exit 1

