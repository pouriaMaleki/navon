name: Companion iOS

on:
  pull_request:
    paths:
      - '.github/workflows/companion-ios-self-hosted.yml'
      - 'companion-ios/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/companion-ios-self-hosted.yml'
      - 'companion-ios/**'
  workflow_dispatch:
    inputs:
      build_kind:
        description: 'Which iOS build flow to run'
        required: true
        default: signed_device
        type: choice
        options:
          - signed_device
          - simulator_validation
      ios_bundle_id:
        description: 'Bundle identifier to sign and export'
        required: false
        default: me.fiksu.esp32map.companion.ios
        type: string
      ios_development_team:
        description: 'Apple Development Team ID configured on the self-hosted Mac'
        required: false
        type: string
      export_method:
        description: 'Export method for the signed IPA'
        required: true
        default: development
        type: choice
        options:
          - development
          - ad-hoc

permissions:
  contents: read

jobs:
  simulator-validation:
    name: Build iOS App Shell
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_kind == 'simulator_validation'
    runs-on:
      - self-hosted
      - macOS
    defaults:
      run:
        working-directory: companion-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure XcodeGen is available
        shell: bash
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            exit 0
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo 'Homebrew is required on the self-hosted macOS runner to install xcodegen.' >&2
            exit 1
          fi

          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -project ESP32MapCompanion.xcodeproj \
            -scheme ESP32MapCompanion \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  signed-device-build:
    name: Export Signed iPhone Build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_kind == 'signed_device'
    runs-on:
      - self-hosted
      - macOS
    defaults:
      run:
        working-directory: companion-ios
    env:
      IOS_BUNDLE_ID: ${{ github.event.inputs.ios_bundle_id }}
      IOS_DEVELOPMENT_TEAM: ${{ github.event.inputs.ios_development_team }}
      IOS_EXPORT_METHOD: ${{ github.event.inputs.export_method }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing inputs
        shell: bash
        run: |
          if [ -z "$IOS_DEVELOPMENT_TEAM" ]; then
            echo 'ios_development_team workflow input is required for signed builds.' >&2
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure XcodeGen is available
        shell: bash
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            exit 0
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo 'Homebrew is required on the self-hosted macOS runner to install xcodegen.' >&2
            exit 1
          fi

          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive signed iPhone build
        shell: bash
        run: |
          rm -rf build/export build/ESP32MapCompanion.xcarchive
          xcodebuild \
            -project ESP32MapCompanion.xcodeproj \
            -scheme ESP32MapCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ESP32MapCompanion.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            archive

      - name: Create export options
        shell: bash
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$IOS_EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$IOS_DEVELOPMENT_TEAM</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ESP32MapCompanion.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Summarize export
        shell: bash
        run: |
          echo "Bundle identifier: $IOS_BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Development team: $IOS_DEVELOPMENT_TEAM" >> "$GITHUB_STEP_SUMMARY"
          echo "Export method: $IOS_EXPORT_METHOD" >> "$GITHUB_STEP_SUMMARY"
          ls -R build/export >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: companion-ios-signed-ipa
          path: |
            companion-ios/build/export/*.ipa
            companion-ios/build/export/*.plist
          if-no-files-found: error

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: companion-ios-xcarchive
          path: companion-ios/build/ESP32MapCompanion.xcarchive
          if-no-files-found: error
