name: Navon iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-testflight:
    name: Build and Upload TestFlight IPA
    runs-on:
      - self-hosted
      - macOS
    defaults:
      run:
        working-directory: companion-apps/ios
    env:
      IOS_DEVELOPMENT_TEAM: ${{ vars.IOS_DEVELOPMENT_TEAM }}
      IOS_APP_BUNDLE_ID: app.navon.bike
      IOS_SHARE_EXTENSION_BUNDLE_ID: app.navon.bike.share

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate signing inputs
        shell: bash
        env:
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          for value in \
            IOS_DEVELOPMENT_TEAM \
            APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD \
            IOS_APP_STORE_PROFILE_BASE64 \
            IOS_SHARE_EXTENSION_PROFILE_BASE64 \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID
          do
            if [ -z "${!value}" ]; then
              echo "Missing required GitHub variable or secret: $value" >&2
              exit 1
            fi
          done

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure XcodeGen is available
        shell: bash
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            exit 0
          fi

          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import code-signing certificates
        uses: Apple-Actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Install provisioning profiles
        shell: bash
        env:
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}
        run: |
          install_profile() {
            local base64_value="$1"
            local env_prefix="$2"
            local profile_path plist_path uuid name

            profile_path="$(mktemp -t "${env_prefix}.mobileprovision")"
            plist_path="$(mktemp -t "${env_prefix}.plist")"

            printf '%s' "$base64_value" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" > "$plist_path"

            uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$plist_path")"
            name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$plist_path")"

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

            echo "${env_prefix}_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          }

          install_profile "$IOS_APP_STORE_PROFILE_BASE64" IOS_APP
          install_profile "$IOS_SHARE_EXTENSION_PROFILE_BASE64" IOS_SHARE

      - name: Archive signed iPhone build
        shell: bash
        run: |
          rm -rf build/export build/Navon.xcarchive
          xcodebuild \
            -project Navon.xcodeproj \
            -scheme Navon \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Navon.xcarchive \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            archive

      - name: Create export options
        shell: bash
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_APP_BUNDLE_ID</key>
              <string>$IOS_APP_PROFILE_NAME</string>
              <key>$IOS_SHARE_EXTENSION_BUNDLE_ID</key>
              <string>$IOS_SHARE_PROFILE_NAME</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$IOS_DEVELOPMENT_TEAM</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Navon.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Resolve IPA path
        shell: bash
        run: |
          ipa_path="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo 'No exported IPA found.' >&2
            exit 1
          fi
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload TestFlight IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-testflight-ipa
          path: companion-apps/ios/build/export/*.ipa
          if-no-files-found: error

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-testflight-xcarchive
          path: companion-apps/ios/build/Navon.xcarchive
          if-no-files-found: error

      - name: Upload app to TestFlight
        uses: Apple-Actions/upload-testflight-build@v3
        with:
          app-path: companion-apps/ios/${{ env.IOS_IPA_PATH }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
