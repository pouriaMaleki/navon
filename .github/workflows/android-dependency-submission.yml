name: Android Dependency Submission

on:
  pull_request:
    paths:
      - ".github/workflows/android-dependency-submission.yml"
      - "companion-apps/android/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-dependency-submission.yml"
      - "companion-apps/android/**"
  workflow_dispatch:

jobs:
  android-dependency-graph-pr:
    name: Android Dependency Graph
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Generate Android dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: companion-apps/android
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false

  android-dependency-graph-main:
    name: Android Dependency Graph
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Submit Android dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: companion-apps/android
          dependency-graph: generate-submit-and-upload
          dependency-graph-continue-on-failure: false
