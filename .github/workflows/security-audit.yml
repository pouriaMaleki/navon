name: Security Audit

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-manifest-coverage:
    name: Dependency Manifest Coverage
    runs-on:
      - self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify dependency manifest coverage
        shell: bash
        run: |
          set -euo pipefail

          # Manifest types that require explicit CVE coverage (cargo-audit, npm-audit, etc.)
          # before they can be added to the repo.
          unsupported_manifests="$(
            find . -type f \
              -not -path '*/.embuild/*' \
              -not -path '*/target/*' \
              \( \
                -name 'Package.swift' -o \
                -name 'Package.resolved' -o \
                -name 'Podfile' -o \
                -name 'Podfile.lock' -o \
                -name 'Cartfile' -o \
                -name 'Cartfile.resolved' \
              \) \
              -print | sed 's#^\./##' | sort
          )"

          if [ -n "$unsupported_manifests" ]; then
            echo "Unsupported dependency manifests detected:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$unsupported_manifests" >> "$GITHUB_STEP_SUMMARY"
            echo "Add repository CVE coverage for these ecosystems in the same change." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Gemfile: only the fastlane one is allowed.
          # CVE coverage: GitHub dependency graph auto-parses Gemfile.lock
          # and Dependabot alerts + security updates cover Ruby gems.
          # The lockfile must be present for the graph to track versions.
          gemfiles="$(
            find . -type f \
              \( -name 'Gemfile' -o -name 'Gemfile.lock' \) \
              -print | sed 's#^\./##' | sort
          )"
          allowed="companion-apps/ios/fastlane/Gemfile
          companion-apps/ios/fastlane/Gemfile.lock"
          unexpected_gemfiles="$(comm -23 <(echo "$gemfiles") <(echo "$allowed"))"
          if [ -n "$unexpected_gemfiles" ]; then
            echo "Unauthorized Gemfile(s) outside companion-apps/ios/fastlane/:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$unexpected_gemfiles" >> "$GITHUB_STEP_SUMMARY"
            echo "Only the fastlane Gemfile is allowed. Add CVE coverage for any new Ruby dependency root." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! echo "$gemfiles" | grep -qFx "companion-apps/ios/fastlane/Gemfile.lock"; then
            echo "Missing companion-apps/ios/fastlane/Gemfile.lock" >> "$GITHUB_STEP_SUMMARY"
            echo "Commit the lockfile so GitHub dependency graph can track fastlane's dependencies." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          extra_package_locks="$(
            find . -type f -name 'package-lock.json' -print \
              | sed 's#^\./##' | sort \
              | grep -Ev '^(device/emulator/web|companion-apps/web|homepage)/package-lock.json$' || true
          )"
          if [ -n "$extra_package_locks" ]; then
            echo "Unexpected package-lock.json files detected:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$extra_package_locks" >> "$GITHUB_STEP_SUMMARY"
            echo "Extend CVE automation before adding additional npm dependency roots." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Every image must be in the image-scan matrix below.
          unscanned_images="$(
            find . -type f \
              -not -path '*/.embuild/*' \
              -not -path '*/target/*' \
              -not -path '*/node_modules/*' \
              \( -name 'Dockerfile*' -o -name 'Containerfile*' \) \
              -print | sed 's#^\./##' | sort \
              | grep -Ev '^(device/emulator/web/Dockerfile|companion-apps/server/Dockerfile|infra/ci-runner/Containerfile|infra/devcontainer/Containerfile)$' || true
          )"
          if [ -n "$unscanned_images" ]; then
            echo "Dockerfiles without image scanning:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$unscanned_images" >> "$GITHUB_STEP_SUMMARY"
            echo "Add them to the image-scan matrix in the same change." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Dependency manifest coverage looks current." >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on:
      - self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency review (fail on high/critical)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  cargo-audit:
    name: Cargo Audit
    runs-on:
      - self-hosted
    env:
      SECURITY_ENFORCE: ${{ vars.SECURITY_ENFORCE || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: cargo_audit
        shell: bash
        run: |
          set +e
          cargo audit --deny warnings
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "cargo audit reported vulnerabilities or advisories." >> "$GITHUB_STEP_SUMMARY"
            if [ "$SECURITY_ENFORCE" = "true" ]; then
              exit "$status"
            fi
            echo "SECURITY_ENFORCE=false, not failing build (baseline mode)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cargo audit passed." >> "$GITHUB_STEP_SUMMARY"
          fi

  npm-audit:
    name: NPM Audit (${{ matrix.package }})
    runs-on:
      - self-hosted
    strategy:
      fail-fast: false
      matrix:
        package:
          - device/emulator/web
          - companion-apps/web
          - homepage
    env:
      SECURITY_ENFORCE: ${{ vars.SECURITY_ENFORCE || 'true' }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+)
        id: npm_audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "npm audit found high/critical vulnerabilities in ${{ matrix.package }}." >> "$GITHUB_STEP_SUMMARY"
            if [ "$SECURITY_ENFORCE" = "true" ]; then
              exit "$status"
            fi
            echo "SECURITY_ENFORCE=false, not failing build (baseline mode)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm audit passed at high threshold for ${{ matrix.package }}." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Scans the image each Dockerfile runs on (its last FROM). Lockfile audits
  # never see base-image CVEs, e.g. a frozen nginx tag. No Docker needed.
  image-scan:
    name: Image Scan (${{ matrix.file }})
    runs-on:
      - self-hosted
      - Linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: device/emulator/web/Dockerfile
            enforce: true
          - file: companion-apps/server/Dockerfile
            enforce: true
          # Dev tooling, home network only: report, don't fail.
          - file: infra/ci-runner/Containerfile
            enforce: false
          - file: infra/devcontainer/Containerfile
            enforce: false
    env:
      SECURITY_ENFORCE: ${{ vars.SECURITY_ENFORCE || 'true' }}
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Trivy (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/trivy.tgz"
          curl -fsSLo "$tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan runtime base image (high+, fixable)
        shell: bash
        env:
          FILE: ${{ matrix.file }}
          ENFORCE: ${{ matrix.enforce }}
        run: |
          set +e
          image="$(grep -iE '^FROM ' "$FILE" | tail -1 | awk '{for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; exit }}')"
          echo "Runtime base of $FILE: $image" >> "$GITHUB_STEP_SUMMARY"
          trivy image --image-src remote --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --no-progress "$image"
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "Fixable high/critical CVEs in $image. Bump the FROM tag or rebuild on a newer base." >> "$GITHUB_STEP_SUMMARY"
            if [ "$SECURITY_ENFORCE" = "true" ] && [ "$ENFORCE" = "true" ]; then
              exit "$status"
            fi
            echo "Not failing the build (report only)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No fixable high/critical CVEs in $image." >> "$GITHUB_STEP_SUMMARY"
          fi
