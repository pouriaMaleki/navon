name: Security Audit

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-manifest-coverage:
    name: Dependency Manifest Coverage
    runs-on:
      - self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify dependency manifest coverage
        shell: bash
        run: |
          set -euo pipefail

          unsupported_manifests="$(
            find . -type f \
              -not -path '*/.embuild/*' \
              -not -path '*/target/*' \
              \( \
                -name 'Package.swift' -o \
                -name 'Package.resolved' -o \
                -name 'Podfile' -o \
                -name 'Podfile.lock' -o \
                -name 'Cartfile' -o \
                -name 'Cartfile.resolved' -o \
                -name 'Gemfile' -o \
                -name 'Gemfile.lock' \
              \) \
              -print | sed 's#^\./##' | sort
          )"

          if [ -n "$unsupported_manifests" ]; then
            echo "Unsupported dependency manifests detected:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$unsupported_manifests" >> "$GITHUB_STEP_SUMMARY"
            echo "Add repository CVE coverage for these ecosystems in the same change." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          extra_package_locks="$(
            find . -type f -name 'package-lock.json' -print \
              | sed 's#^\./##' | sort \
              | grep -Ev '^(device/emulator/web|companion-apps/web)/package-lock.json$' || true
          )"
          if [ -n "$extra_package_locks" ]; then
            echo "Unexpected package-lock.json files detected:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$extra_package_locks" >> "$GITHUB_STEP_SUMMARY"
            echo "Extend CVE automation before adding additional npm dependency roots." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Dependency manifest coverage looks current." >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on:
      - self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency review (fail on high/critical)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  cargo-audit:
    name: Cargo Audit
    runs-on:
      - self-hosted
    env:
      SECURITY_ENFORCE: ${{ vars.SECURITY_ENFORCE || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: cargo_audit
        shell: bash
        run: |
          set +e
          cargo audit --deny warnings
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "cargo audit reported vulnerabilities or advisories." >> "$GITHUB_STEP_SUMMARY"
            if [ "$SECURITY_ENFORCE" = "true" ]; then
              exit "$status"
            fi
            echo "SECURITY_ENFORCE=false, not failing build (baseline mode)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cargo audit passed." >> "$GITHUB_STEP_SUMMARY"
          fi

  npm-audit:
    name: NPM Audit (${{ matrix.package }})
    runs-on:
      - self-hosted
    strategy:
      fail-fast: false
      matrix:
        package:
          - device/emulator/web
          - companion-apps/web
    env:
      SECURITY_ENFORCE: ${{ vars.SECURITY_ENFORCE || 'true' }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+)
        id: npm_audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "npm audit found high/critical vulnerabilities in ${{ matrix.package }}." >> "$GITHUB_STEP_SUMMARY"
            if [ "$SECURITY_ENFORCE" = "true" ]; then
              exit "$status"
            fi
            echo "SECURITY_ENFORCE=false, not failing build (baseline mode)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm audit passed at high threshold for ${{ matrix.package }}." >> "$GITHUB_STEP_SUMMARY"
          fi
