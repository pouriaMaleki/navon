name: CodeQL

on:
  pull_request:
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-availability:
    name: CodeQL Availability
    runs-on: ubuntu-latest
    outputs:
      run_codeql: ${{ steps.decide.outputs.run_codeql }}
    steps:
      - name: Decide whether CodeQL can run
        id: decide
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          PRIVATE_CODEQL_ENABLED: ${{ vars.PRIVATE_CODEQL_ENABLED }}
        run: |
          if [ "${REPO_PRIVATE}" != "true" ]; then
            echo "run_codeql=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${PRIVATE_CODEQL_ENABLED}" = "true" ]; then
            echo "run_codeql=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_codeql=false" >> "$GITHUB_OUTPUT"

  analyze:
    needs: codeql-availability
    if: needs.codeql-availability.outputs.run_codeql == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "rust"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  codeql-unavailable:
    needs: codeql-availability
    if: needs.codeql-availability.outputs.run_codeql != 'true'
    name: CodeQL Unavailable
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Skipping CodeQL because this repository is private and GitHub code scanning is not enabled for it."
          echo "::notice::If you enable GitHub Code Security later, add repo variable PRIVATE_CODEQL_ENABLED=true to run this workflow again."
