name: Companion Android

on:
  pull_request:
    paths:
      - '.github/workflows/companion-apps/android.yml'
      - 'companion-apps/android/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/companion-apps/android.yml'
      - 'companion-apps/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Android Companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android quality gates
        run: ./gradlew clean lintDebug testDebugUnitTest assembleDebug --no-build-cache --rerun-tasks

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: companion-apps/android-debug-apk
          path: companion-apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
