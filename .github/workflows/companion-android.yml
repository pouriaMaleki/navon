name: Companion Android

on:
  pull_request:
    paths:
      - '.github/workflows/companion-android.yml'
      - 'companion-android/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/companion-android.yml'
      - 'companion-android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Android Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: companion-android-debug-apk
          path: companion-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
