name: Navon Android

on:
  pull_request:
    paths:
      - '.github/workflows/companion-apps/android.yml'
      - 'companion-apps/android/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/companion-apps/android.yml'
      - 'companion-apps/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Android Companion
    runs-on:
      - self-hosted
      - Linux
    defaults:
      run:
        working-directory: companion-apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Container image cimg/android:2025.04 provides JDK 21 + Android SDK.
      # Only need the specific platform packages.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android quality gates
        run: ./gradlew clean lintDebug testDebugUnitTest assembleDebug --no-build-cache --rerun-tasks

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: companion-apps/android-debug-apk
          path: companion-apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
