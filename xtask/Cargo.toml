[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "gen-gps-fixtures"
path = "src/bin/gen_gps_fixtures.rs"

[[bin]]
name = "baseline"
path = "src/bin/baseline.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json", "tls"] }
