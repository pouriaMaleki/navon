<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!--
      Lock the page-level scale so the OS browser-zoom can't fight the
      MapLibre pinch-zoom and shred the layout when the device rotates.
      The map handles its own pinch/zoom; the page itself never needs to scale.
    -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050B12" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta property="og:title" content="Navon" />
  <meta property="og:description" content="Bicycle navigation" />
  <meta property="og:image" content="/icon-512.png" />
  <meta property="og:image:alt" content="Navon bike navigation logo" />
  <meta name="twitter:card" content="summary" />
  <title>Navon</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
