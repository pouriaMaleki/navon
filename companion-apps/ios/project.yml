name: Navon
options:
  bundleIdPrefix: app.navon
configs:
  Debug: debug
  Release: release
settings:
  base:
    # Allow automatic team injection when IOS_DEVELOPMENT_TEAM is exported.
    # Local Signing.local.xcconfig remains the persisted fallback for Xcode.
    DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
targets:
  Navon:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - CompanionApp
      - CompanionSharedImport
      - CompanionLiveActivity/Shared
    dependencies:
      - target: NavonShare
        embed: true
      - target: NavonLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.navon.bike
        PRODUCT_NAME: Navon
        INFOPLIST_FILE: CompanionApp/Info.plist
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: CompanionApp/CompanionApp.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: app.navon.bike
    scheme:
      testTargets:
        - NavonTests
        - NavonUITests
  NavonTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NavonTests
    dependencies:
      - target: Navon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.navon.bike.tests
        SWIFT_VERSION: 5.10
        INFOPLIST_FILE: NavonTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Navon.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Navon"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NavonUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NavonUITests
    dependencies:
      - target: Navon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.navon.bike.uitests
        SWIFT_VERSION: 5.10
        INFOPLIST_FILE: NavonUITests/Info.plist
        TEST_TARGET_NAME: Navon
  NavonLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - CompanionLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.navon.bike.liveactivity
        PRODUCT_NAME: NavonLiveActivity
        INFOPLIST_FILE: CompanionLiveActivity/Info.plist
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: app.navon.bike.liveactivity
  NavonShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - CompanionShareExtension
      - CompanionSharedImport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.navon.bike.share
        PRODUCT_NAME: NavonShare
        INFOPLIST_FILE: CompanionShareExtension/Info.plist
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CompanionShareExtension/CompanionShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: app.navon.bike.share
