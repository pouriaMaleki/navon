# Named time slices into stream.jsonl. Offsets are ms from the first fix.

[stationary_with_gps_noise]
start_ms = 0
end_ms = 1000
expect = "mode stays stationary, camera centered, speed hidden"

[start_moving_then_stop]
start_ms = 1000
end_ms = 2227000
expect = "mode transitions stationary -> moving, speed becomes visible"

[on_route_whole_ride]
start_ms = 0
end_ms = 2644000
expect = "full ride playback; next-turn distances trend-monotonic"

[gps_dropout]
start_ms = 1000
end_ms = 6000
# Note: scenarios that simulate dropout do so by zeroing emission in the loader,
# not in the fixture itself. This slice is the reference window.
expect = "camera holds, overlay marks stale after gap"
