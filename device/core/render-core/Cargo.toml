[package]
name = "render-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["runtime-core/std"]

[dependencies]
runtime-core = { path = "../runtime-core", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }

[dev-dependencies]
# Inline-storage Vec used in test fixtures that construct
# `MapPolylineCandidate { points: smallvec![…] }`. Production
# render-core code reads polylines as `&[WorldPoint]` and does not
# care about the storage shape.
smallvec = "1"

[build-dependencies]
resvg = { version = "0.47.0", default-features = false }
