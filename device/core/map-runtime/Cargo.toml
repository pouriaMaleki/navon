[package]
name = "map-runtime"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["std", "embedded-map"]
std = ["runtime-core/std"]
# Embeds a city map into the binary via `include_bytes!`. Selected at
# compile time by target_os (not by a separate feature), so workspace
# feature unification cannot accidentally embed two maps in one binary:
#   - `target_os = "espidf"` → `../map-data/city-small.svm` (~9.6 MB, 400k
#     segments, fits the ESP32-P4's 64 MB flash-mapped DROM region).
#   - otherwise → `../map-data/city.svm` (~76 MB full dataset for the
#     emulator, wasm, and host fixtures).
# Disabling this feature yields a zero-segment placeholder map via
# `EmbeddedMapSource::empty()` — useful for fixture tests that supply
# their own `MapSource` without paying the include-bytes compile cost.
embedded-map = []

[dependencies]
runtime-core = { path = "../runtime-core", default-features = false }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
# Used in the `query` hot path to construct 2-point polylines with
# inline storage instead of one heap allocation per visible segment.
smallvec = { version = "1", default-features = false }
