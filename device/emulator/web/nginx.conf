server {
    listen 4173 default_server;
    listen [::]:4173 default_server;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy fronts this container on 443/https, but nginx only knows about its
    # own `listen 4173`. Without these, the directory-trailing-slash redirect
    # (e.g. /emulator -> /emulator/) leaks `http://host:4173/...` to the
    # browser and breaks the public URL. Emit a relative Location instead so
    # the client resolves it against whatever scheme/host/port it used.
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # Let compressed assets sail through with a long immutable cache — Vite emits
    # content-hashed filenames so the cache is safe across deploys.
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/wasm
               text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Homepage (static Astro-style marketing site).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HSL proxy — forward API requests to the Rust server container.
    location /api/ {
        proxy_pass http://hsl-proxy:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Companion web app under /app/.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Emulator web app under /emulator/.
    location /emulator/ {
        try_files $uri $uri/ /emulator/index.html;
    }

    # Hashed Vite asset directories get a long cache; HTML is revalidated every
    # request so a deploy flips both apps immediately.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /app/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /emulator/index.html {
        add_header Cache-Control "no-cache";
    }
}
