        INFOPLIST_FILE: CompanionApp/Info.plist
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
