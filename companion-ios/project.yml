name: ESP32MapCompanion
options:
  bundleIdPrefix: me.fiksu.esp32map
configs:
  Debug: debug
  Release: release
targets:
  ESP32MapCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
