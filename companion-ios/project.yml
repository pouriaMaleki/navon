name: ESP32MapCompanion
options:
  bundleIdPrefix: me.fiksu.esp32map
configs:
  Debug: debug
  Release: release
targets:
  ESP32MapCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - CompanionApp
      - CompanionSharedImport
      - CompanionLiveActivity/Shared
    dependencies:
      - target: ESP32MapCompanionShare
        embed: true
      - target: ESP32MapCompanionLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fiksu.esp32map.companion.ios
        PRODUCT_NAME: ESP32MapCompanion
        INFOPLIST_FILE: CompanionApp/Info.plist
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: CompanionApp/CompanionApp.entitlements
    scheme:
      testTargets:
        - ESP32MapCompanionTests
        - ESP32MapCompanionUITests
  ESP32MapCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ESP32MapCompanionTests
    dependencies:
      - target: ESP32MapCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fiksu.esp32map.companion.ios.tests
        SWIFT_VERSION: 5.10
        INFOPLIST_FILE: ESP32MapCompanionTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ESP32MapCompanion.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ESP32MapCompanion"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ESP32MapCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ESP32MapCompanionUITests
    dependencies:
      - target: ESP32MapCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fiksu.esp32map.companion.ios.uitests
        SWIFT_VERSION: 5.10
        INFOPLIST_FILE: ESP32MapCompanionUITests/Info.plist
        TEST_TARGET_NAME: ESP32MapCompanion
  ESP32MapCompanionLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - CompanionLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fiksu.esp32map.companion.ios.liveactivity
        PRODUCT_NAME: ESP32MapCompanionLiveActivity
        INFOPLIST_FILE: CompanionLiveActivity/Info.plist
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  ESP32MapCompanionShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - CompanionShareExtension
      - CompanionSharedImport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fiksu.esp32map.companion.ios.share
        PRODUCT_NAME: ESP32MapCompanionShare
        INFOPLIST_FILE: CompanionShareExtension/Info.plist
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CompanionShareExtension/CompanionShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
