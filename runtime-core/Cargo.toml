[package]
name = "runtime-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ECS runtime core for ESP32 minimap projects"

[lib]
name = "runtime_core"
path = "src/lib.rs"

[dependencies]
bevy_ecs = { version = "=0.17.2", default-features = false }
esp32-screen-render-core = { path = "../render-core" }
heapless = "0.8"
libm = "0.2"
