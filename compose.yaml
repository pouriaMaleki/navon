services:
  emulator-web:
    build:
      context: .
      dockerfile: emulator/web/Dockerfile
    ports:
      - "0.0.0.0:${EMULATOR_PORT:-4173}:4173"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
