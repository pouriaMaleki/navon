services:
  dev:
    build:
      context: .
      dockerfile: infra/devcontainer/Containerfile
    image: esp32-dev:latest
    container_name: esp32-dev
    command: sleep infinity
    tty: true
    stdin_open: true
    environment:
      - TZ=Europe/Helsinki
    volumes:
      - ./:/work:Z
      - cargo-cache:/home/vscode/.cargo

volumes:
  cargo-cache:
