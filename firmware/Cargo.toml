[package]
name = "firmware"
version = "0.1.0"
edition = "2024"
resolver = "2"
build = "build.rs"

[[bin]]
name = "firmware"
path = "src/main.rs"

[dependencies]
# Disable the `embedded-city-map` feature so the 79 MB city.svm is not
# linked into the device binary; it exceeds P4 flash-mapped DROM. The full
# map will be loaded from a dedicated flash partition at runtime (Phase 3).
map-runtime = { path = "../map-runtime", default-features = false, features = ["std"] }
render-core = { path = "../render-core" }
runtime-core = { path = "../runtime-core" }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.52.1", features = ["binstart"] }
log = "0.4"
enumset = "1.1.10"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = "sdkconfig.defaults"
esp_idf_tools_install_dir = "workspace"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(esp32s2)",
    "cfg(esp32p4)",
    "cfg(esp_idf_bt_enabled)",
    "cfg(esp_idf_bt_bluedroid_enabled)",
] }
