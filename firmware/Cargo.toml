[package]
edition      = "2024"
name         = "esp32-hello"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32-hello"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32"] }
esp-backtrace = { version = "0.18.1", features = ["esp32", "println", "panic-handler"] }
esp-println = { version = "0.16.1", features = ["esp32"] }

esp32-screen-render-core = { path = "../render-core" }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }

critical-section = "1.2.0"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
